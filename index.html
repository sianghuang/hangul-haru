<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="韓文從零開始：24 個基本字母、拼音節、常用單字，搭配盲看與真人式韓語語音合成練習。">
  <title>한글하루 · 韓文入門練習</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./" aria-label="韓文練習首頁"><span class="seal" aria-hidden="true">ㅎ</span><span><strong>한글하루</strong><small>HANGUL HARU</small></span></a>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="helpBtn" aria-label="學習說明" title="學習說明">?</button>
      <div class="setting-wrap" id="settingWrap">
        <button type="button" class="icon-btn" id="settingBtn" aria-expanded="false" aria-controls="settings" aria-label="練習設定" title="設定">⚙</button>
        <section id="settings" class="settings" hidden>
          <div class="settings-title"><strong>練習設定</strong><button type="button" id="closeSettings" class="close-text">關閉 ×</button></div>
          <label class="row-setting">字母範圍<select id="letterFilter"><option value="all">全部基本字母</option><option value="vowel">只練母音</option><option value="consonant">只練子音</option></select></label>
          <label class="tick"><input id="advancedVowels" type="checkbox"> 加入複合母音（11）</label>
          <label class="tick"><input id="tenseConsonants" type="checkbox"> 加入緊音子音（5）</label>
          <label class="tick"><input id="withBatchim" type="checkbox"> 拼音節加入收尾子音</label>
          <hr>
          <label class="row-setting">單字分類<select id="wordTheme"><option value="all">全部</option><option value="daily">日常</option><option value="food">美食</option><option value="travel">旅遊</option><option value="greeting">問候</option></select></label>
          <label class="tick"><input id="blind" type="checkbox" checked> 盲看模式</label>
          <label class="tick"><input id="random" type="checkbox" checked> 隨機抽題</label>
          <label class="tick"><input id="autoplay" type="checkbox"> 揭曉自動播放讀音</label>
        </section>
      </div>
    </div>
  </header>

  <main class="practice">
    <div class="intro">
      <h1>每天一點，<em>讀懂韓文。</em></h1>
      <p>先自己念，再揭曉。從字母一路練到單字。</p>
    </div>
    <div class="tabs" role="tablist" aria-label="練習階段">
      <button type="button" class="tab active" role="tab" aria-selected="true" data-mode="letters"><small>01</small><span>字母</span></button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-mode="syllables"><small>02</small><span>拼音節</span></button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-mode="words"><small>03</small><span>單字</span></button>
    </div>

    <article class="flashcard" id="card" aria-label="韓文練習卡片">
      <div class="card-label">
        <span id="cardCount" aria-label="練習題進度">01 / 24</span>
        <button id="chartOpen" type="button" class="lookup-btn" aria-haspopup="dialog" aria-controls="chartDialog"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3.25" y="3.25" width="7.25" height="7.25" rx="1.25"/><rect x="13.5" y="3.25" width="7.25" height="7.25" rx="1.25"/><rect x="3.25" y="13.5" width="7.25" height="7.25" rx="1.25"/><rect x="13.5" y="13.5" width="7.25" height="7.25" rx="1.25"/></svg><span>字母表</span></button>
      </div>
      <div id="question" class="question-area">
        <div class="circle"><div lang="ko" id="glyph" class="glyph"></div></div>
        <p id="questionPrompt">這個字母怎麼念？</p>
        <span id="hint" class="hint" hidden></span>
      </div>
      <div id="answer" class="answer" hidden>
        <div class="answer-head">
          <div lang="ko" id="answerGlyph" class="answer-glyph"></div>
          <div class="answer-details">
            <strong id="roman" class="roman"></strong>
            <p id="pronunciation" class="pronunciation"></p>
            <button type="button" id="audioBtn" class="audio-btn">♫ 聽發音</button>
          </div>
        </div>
        <div class="composition" id="composition" hidden><small>拆解</small><strong id="compositionText" lang="ko"></strong></div>
        <div class="vocab">
          <div class="vocab-title" id="vocabHeading">例字</div>
          <div class="vocab-row">
            <div class="vocab-text">
              <div id="vocabKo" lang="ko" class="vocab-ko"></div>
              <p id="vocabRoman" class="vocab-roman"></p>
              <strong id="vocabZh" class="vocab-zh"></strong>
            </div>
            <button type="button" id="vocabAudioBtn" class="audio-btn vocab-audio-btn" aria-label="播放例字發音">♫ <span>聽單字</span></button>
          </div>
        </div>
        <p class="note" id="note" hidden></p>
      </div>
    </article>
    <div class="controls">
      <button type="button" id="mainBtn" class="main-btn">揭曉答案 <span>→</span></button>
      <button type="button" id="skipBtn" class="skip-btn"><span>略過</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h12m-5.25-5.25L15.5 12l-5.25 5.25M20 5v14"/></svg></button>
    </div>
    <div class="progress-inline">
      <span>今天 <strong id="todayCount">0</strong> 題</span>
      <span>已看 <strong id="seenCount">0</strong><span id="totalCount">/24</span></span>
      <div class="progress" role="progressbar" aria-label="本階段練習進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div id="progressBar"></div></div>
    </div>
    <p class="shortcuts">鍵盤 <kbd>Space</kbd> 揭曉／下一題 · <kbd>→</kbd> 略過</p>
  </main>
  <footer><span>한글하루 · 每天一點韓文</span><a href="https://github.com/sianghuang/hangul-haru" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
</div>

<dialog id="chartDialog" class="chart-dialog" aria-labelledby="chartTitle">
  <div class="chart-header"><div><h2 id="chartTitle">字母表</h2><p>點字母直接練習 · <span class="seen-guide">綠色代表已看過</span></p></div><button type="button" id="chartClose" class="dialog-close" aria-label="關閉字母表">×</button></div>
  <div id="chartBody" class="chart-body"></div>
</dialog>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpTitle">
  <button type="button" class="dialog-close help-close" id="closeHelp" aria-label="關閉說明">×</button>
  <h2 id="helpTitle">韓文像積木一樣拼。</h2>
  <div class="help-demo" lang="ko"><span>ㄱ</span><i>＋</i><span>ㅏ</span><i>＝</i><strong>가</strong></div>
  <p>韓文先用子音和母音組成音節，再把音節串成單字。母音開頭時會用不發聲的 ㅇ 佔位，例如 아。</p>
  <p>依序練「字母 → 拼音節 → 單字」。羅馬拼音只是輔助，請多聽韓文發音；收尾子音和連音可能讓實際讀法不同。</p>
  <button type="button" class="main-btn help-start" id="helpStart">開始練習 →</button>
</dialog>
</body>
</html>
