      <h1>那些沒說完的，<em>深情。</em></h1>
      <p>把韓劇裡的心動、想念與離別，收藏成一頁隨時能開口練習的情話。</p>
      <div class="hero-mark" aria-hidden="true">“</div>

    <section class="toolbar" aria-label="搜尋與篩選">
      <div class="search-row">

        <button type="button" id="randomBtn" class="random-btn" title="隨機抽一句情話">↝ <span>抽一句</span></button>
      </div>
      <nav id="categoryNav" class="category-nav" aria-label="心情分類"></nav>

          <button type="button" data-kind="all" aria-pressed="true">全部</button>
          <button type="button" data-kind="verified" aria-pressed="false">劇中原句</button>
          <button type="button" data-kind="original" aria-pressed="false">原創韓劇風</button>

        <span id="resultCount" role="status" aria-live="polite"></span>
      </div>

    <div id="featured" class="featured" hidden></div>
    <div id="sections"></div>
